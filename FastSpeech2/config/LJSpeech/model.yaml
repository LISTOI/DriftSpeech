transformer:
  encoder_layer: 4
  encoder_head: 2
  encoder_hidden: 256
  decoder_layer: 6
  decoder_head: 2
  decoder_hidden: 256
  conv_filter_size: 1024
  conv_kernel_size: [9, 1]
  encoder_dropout: 0.2
  decoder_dropout: 0.2

variance_predictor:
  filter_size: 256
  kernel_size: 3
  dropout: 0.5

phoneme_style:
  frame_hidden: 256
  conv_layers: 2
  conv_kernel_size: 5
  dropout: 0.1
  bottleneck_dim: 32
  strict_duration_check: true
  adversarial:
    enabled: true
    hidden: 64
    dropout: 0.1
    weight: 0.01
    grl_lambda: 0.1
  vq:
    enabled: false
    codebook_size: 128
    commitment_weight: 0.25
    codebook_weight: 1.0

mel_flow:
  enabled: true
  hidden_dim: 256
  depth: 6
  num_heads: 4
  dropout: 0.1
  conv_smoother_layers: 2
  conv_smoother_kernel_size: 5
  time_embed_dim: 256
  noise_scale: 1.0
  prediction_type: velocity
  cfg:
    enabled: true
    condition_dropout: 0.1
    null_condition: learned
    guidance_scale: 1.5

loss:
  duration_weight: 1.0
  flow_mel_weight: 1.0

# gst:
#   use_gst: False
#   conv_filters: [32, 32, 64, 64, 128, 128]
#   gru_hidden: 128
#   token_size: 128
#   n_style_token: 10
#   attn_head: 4

multi_speaker: False

max_seq_len: 1000

vocoder:
  model: "HiFi-GAN" # support 'HiFi-GAN', 'MelGAN'
  speaker: "LJSpeech" # support  'LJSpeech', 'universal'
